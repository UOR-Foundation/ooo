# PRs verify documents; only trusted source/CI changes compile LaTeX.
# Releases are published only from successfully compiled pushes to main.
name: Compile and Publish LaTeX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    outputs:
      latex: ${{ steps.classify.outputs.latex }}
      publish: ${{ steps.classify.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify exact diff, defaulting to LaTeX verification
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath

          base, head = os.environ.get("BASE", ""), os.environ["HEAD"]
          latex = True
          publish = False
          if base and base != "0" * 40:
              result = subprocess.run(
                  ["git", "diff", "--name-status", "-z", "--no-renames", base, head],
                  capture_output=True, check=True
              )
              fields = [p for p in result.stdout.split(b"\0") if p]
              if len(fields) % 2:
                  raise SystemExit("Malformed git diff: refusing to classify")
              changes = list(zip(fields[::2], fields[1::2]))
              def needs_latex(changed):
                  if not changed:
                      return True
                  for status, path in changed:
                      readme = status == b"M" and path == b"README.md"
                      png = (
                          status == b"M"
                          and path.startswith(b"assets/")
                          and path.endswith(b".png")
                      )
                      maintainers = (
                          status in (b"A", b"M")
                          and path == b"MAINTAINERS.md"
                      )
                      if not (readme or png or maintainers):
                          return True
                  return False

              # Protect the fast path against input or source scope drift.
              assert not needs_latex([(b"A", b"MAINTAINERS.md")])
              assert not needs_latex([(b"M", b"MAINTAINERS.md")])
              assert not needs_latex([(b"M", b"README.md")])
              assert needs_latex([])
              assert needs_latex([(b"D", b"MAINTAINERS.md")])
              assert needs_latex([(b"A", b"AGENTS.md")])
              assert needs_latex([(b"M", b"ooo.tex")])
              assert needs_latex([
                  (b"A", b"MAINTAINERS.md"),
                  (b"M", b".github/workflows/latex.yml"),
              ])
              latex = needs_latex(changes)
              publish = any(path.endswith(b".tex") for _, path in changes)
              print("Changed paths:", [p.decode("utf-8", "replace") for _, p in changes])
          print("LaTeX compilation required:", latex)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"latex={str(latex).lower()}\n")
              output.write(f"publish={str(publish).lower()}\n")
          PY

      - name: Check README links and local PNG assets
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path(".")
          text = (root / "README.md").read_text(encoding="utf-8")
          targets = set(re.findall(r"\[[^\]]*\]\(([^)]+)\)", text))
          for target in sorted(targets):
              if target.startswith(("https://", "http://", "#", "mailto:")):
                  continue
              path = target.split("#", 1)[0]
              if path and not (root / path).exists():
                  raise SystemExit(f"README target missing: {target}")
          if not (root / "assets/readme-banner-PLACEHOLDER.png").is_file():
              raise SystemExit("Local README placeholder PNG is missing")
          print("README relative link and PNG preflight passed")
          PY

      - name: Install minimal TeX packages
        if: steps.classify.outputs.latex == 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended

      - name: Compile LaTeX manuscript
        if: steps.classify.outputs.latex == 'true'
        run: |
          set -euo pipefail
          mkdir -p pdf_output
          pdflatex -halt-on-error -interaction=nonstopmode -output-directory=pdf_output ooo.tex
          pdflatex -halt-on-error -interaction=nonstopmode -output-directory=pdf_output ooo.tex
          test -s pdf_output/ooo.pdf

      - name: Upload compiled PDF
        if: steps.classify.outputs.latex == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latex-pdfs
          path: pdf_output/ooo.pdf
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [build]
    if: github.event_name == 'push' && needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: latex-pdfs
          path: pdf_output
      - name: Publish compiled paper from main only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="v$(date -u +'%Y%m%d%H%M%S')"
          gh release create "$VERSION" --title "LaTeX Documents $(date -u +'%Y-%m-%d')" --notes "Generated from a verified main-branch LaTeX build" pdf_output/ooo.pdf
